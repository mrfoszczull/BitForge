name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            build_type: Debug
          - os: ubuntu-latest
            compiler: gcc
            build_type: Release
          - os: ubuntu-latest
            compiler: clang
            build_type: Debug
          - os: ubuntu-latest
            compiler: clang
            build_type: Release
          - os: macos-latest
            compiler: clang
            build_type: Debug
          - os: macos-latest
            compiler: clang
            build_type: Release
          - os: windows-latest
            compiler: msvc
            build_type: Debug
          - os: windows-latest
            compiler: msvc
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "msvc" ]; then
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          else
            cmake -S . -B build \
              -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: AddressSanitizer + UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DBITFORGE_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Run tests
        run: ctest --test-dir build-sanitize --output-on-failure

  static-analysis:
    name: Cppcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run Cppcheck
        run: >
          cppcheck
          --enable=warning,style,performance,portability
          --error-exitcode=1
          --std=c17
          --language=c
          --suppress=constVariable
          -I include
          src/ include/ tests/

  format-check:
    name: Clang Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: make format-check

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Install Moxygen
        run: sudo npm install -g moxygen

      - name: Generate documentation
        run: make docs

      - name: Verify generated module docs
        shell: bash
        run: |
          for doc in \
            docs/parser.md \
            docs/formats_png.md \
            docs/formats_bmp.md \
            docs/formats_wav.md \
            docs/formats_elf.md \
            docs/formats_pe.md
          do
            test -f "$doc" || { echo "Missing generated doc: $doc"; exit 1; }
          done

  install-test:
    name: Installed package test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure BitForge
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build BitForge
        run: cmake --build build --parallel

      - name: Install BitForge
        run: cmake --install build --prefix "$HOME/bitforge-install"

      - name: Create consumer project
        shell: bash
        run: |
          mkdir -p consumer

          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(BitForgeConsumer LANGUAGES C)

          set(CMAKE_C_STANDARD 17)
          set(CMAKE_C_STANDARD_REQUIRED ON)
          set(CMAKE_C_EXTENSIONS OFF)

          find_package(BitForge 2.0.0 CONFIG REQUIRED)

          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE BitForge::bitforge)
          EOF

          cat > consumer/main.c <<'EOF'
          #include <bitforge/buffer.h>
          #include <bitforge/formats/bmp.h>
          #include <bitforge/formats/elf.h>
          #include <bitforge/formats/pe.h>
          #include <bitforge/formats/png.h>
          #include <bitforge/formats/wav.h>
          #include <bitforge/parser.h>
          #include <stdint.h>
          #include <stdio.h>

          int main(void)
          {
              uint8_t storage[8] = {0};
              bf_buffer_t buffer;

              if (bf_buffer_init(&buffer, storage, sizeof(storage)) != BF_OK) {
                  return 1;
              }

              const uint8_t value = 0x08;

              if (bf_buffer_append(&buffer, &value, 1) != BF_OK) {
                  return 1;
              }

              uint8_t raw[4] = {0x01, 0x02, 0x03, 0x04};
              bf_stream_t stream;
              if (bf_stream_init(&stream, raw, sizeof(raw)) != BF_OK) {
                  return 1;
              }

              uint32_t le_val = 0;
              if (bf_parser_read_u32_le(&stream, &le_val) != BF_OK || le_val != 0x04030201u) {
                  return 1;
              }

              printf("Buffer size: %zu\n", buffer.size);
              return 0;
          }
          EOF

      - name: Configure consumer
        run: >
          cmake -S consumer -B consumer/build
          -DCMAKE_PREFIX_PATH="$HOME/bitforge-install"

      - name: Build consumer
        run: cmake --build consumer/build --parallel

      - name: Run consumer
        shell: bash
        run: |
          output=$(./consumer/build/consumer)
          echo "$output"
          test "$output" = "Buffer size: 1"
